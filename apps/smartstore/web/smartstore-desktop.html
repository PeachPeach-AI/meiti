<div class="auth-gate" id="authGate">

    <h1 class="auth-title">自媒体工作站</h1>

    <div class="auth-field"><label>密码</label><input class="input" id="authPass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>

    <div class="auth-brand ok"><span class="auth-logo">✓</span></div>

</div>
<div class="win">
  <nav class="rail" id="rail" data-od-id="icon-rail"></nav>

  <div class="content">
    <div class="toolbar">
      <span class="clabel" id="clabel"></span>
      <div class="mtabs" id="toolTabs"></div>
      <span class="grow"></span>
      <span id="modeSwitch" class="modesw"></span>
    </div>
    <main class="stage" id="stage" data-od-id="stage"></main>
  </div>

  <div class="statusbar">
    <span class="sb" id="sbLeft"></span>
    <span class="grow"></span>
    <span class="sb"><span class="kbd">Ctrl</span>+<span class="kbd">1…4</span> 切换中心</span>
    <span class="sb"><span class="kbd">Ctrl</span>+<span class="kbd">,</span> 设置</span>
    <span class="sb" id="sbRight"></span>
  </div>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<div class="prompter" id="prompter" data-od-id="teleprompter">
  <div class="pm-top">
    <span class="pm-title" id="pmTitle"></span>
    <span class="grow"></span>
    <span class="pm-tools">
      <button class="pmbtn" id="pmFontDown" title="减小字号">A－</button>
      <button class="pmbtn" id="pmFontUp" title="增大字号">A＋</button>
      <span class="pm-lbl num" id="pmSizeVal">102</span>
      <button class="pmbtn" id="pmMirror" title="镜像翻转">镜像</button>
      <button class="pmbtn" id="pmClose" title="退出提词器">退出 Esc</button>
    </span>
  </div>
  <div class="pm-stage">
    <div class="pm-body" id="pmBody"><div class="pm-text" id="pmText"></div></div>
    <div class="pm-guide"><span class="pm-caret"></span></div>
    <div class="pm-count" id="pmCount"></div>
  </div>
  <div class="pm-foot">
    <button class="pmplay" id="pmPlay">播放</button>
    <span class="pm-lbl">速度</span>
    <input type="range" id="pmSpeed" min="1" max="10" step="1" value="3">
    <span class="pm-lbl num" id="pmSpeedVal">3</span>
    <span class="grow"></span>
    <span class="pm-lbl">滚轮可手动上下滚动 · 空格播放/暂停 · ↑↓ 调速</span>
    <span class="pm-lbl num" id="pmProgress">0%</span>
    <button class="pmbtn" id="pmRestart">回到开头</button>
  </div>
</div>

  function acctById(id) { return D.accounts.filter(function (a) { return a.id === id; })[0]; }

  function toast(msg) {
    var t = document.getElementById('ss-toast');
    if (!t) { t = document.createElement('div'); t.id = 'ss-toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }
  function copy(text) { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); toast('已复制到剪贴板'); }

  function popover(anchor, html, side) {
    var p = document.getElementById('ss-pop');
    if (!p) { p = document.createElement('div'); p.id = 'ss-pop'; p.className = 'popover'; document.body.appendChild(p); }
    p.innerHTML = html; p.classList.add('show');
    var r = anchor.getBoundingClientRect(), w = p.offsetWidth;
    if (side) {
      p.style.left = Math.min(r.right + 8, innerWidth - w - 12) + 'px';
      p.style.top = Math.min(Math.max(10, r.top - 10), Math.max(10, innerHeight - p.offsetHeight - 10)) + 'px';
    } else {
      var top = r.bottom + 6;
      p.style.left = Math.min(Math.max(12, r.right - w), innerWidth - w - 12) + 'px';
      if (top + p.offsetHeight > innerHeight - 10) top = Math.max(10, r.top - p.offsetHeight - 6);
      p.style.top = top + 'px';
    }
    var close = function (e) { if (!p.contains(e.target) && !anchor.contains(e.target)) { p.classList.remove('show'); document.removeEventListener('click', close); } };
    setTimeout(function () { document.addEventListener('click', close); }, 0);
    return p;
  }

  function openSheet(title, body, foot) {
    var s = document.getElementById('sheet');
    s.innerHTML = '<header><h3>' + title + '</h3><button class="x" id="sheetX">' + icon('x') + '</button></header>'
      + '<div class="sbody">' + body + '</div>' + (foot ? '<footer>' + foot + '</footer>' : '');
    document.getElementById('mask').classList.add('show');
    document.getElementById('sheetX').addEventListener('click', closeSheet);
    Array.prototype.forEach.call(s.querySelectorAll('.toggle'), function (t) {
      t.addEventListener('click', function () { t.classList.toggle('on'); });
    });
  }
  function closeSheet() { document.getElementById('mask').classList.remove('show'); }
  document.getElementById('mask').addEventListener('click', function (e) { if (e.target.id === 'mask') closeSheet(); });

  function spark(arr) {
    var max = Math.max.apply(null, arr);
    return '<div class="spark">' + arr.map(function (v, i) {
      return '<i' + (i === arr.length - 1 ? ' class="hi"' : '') + ' style="height:' + Math.round(v / max * 100) + '%"></i>';
    }).join('') + '</div>';
  }

  function easelToken() { try { return localStorage.getItem('ss-easel-token') || ''; } catch (e) { return ''; } }
  function easelReloadIframe() {
    var f = document.querySelector('#agentOverlay iframe');

  function easelLogout() {
    var t = easelToken();
    var cur = null; try { cur = JSON.parse(localStorage.getItem('ss-easel-user') || 'null'); } catch (e) {}
    if (t) fetch(window.SS_SERVICES.easel + '/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t } }).catch(function () {});
    try {
      localStorage.removeItem('ss-easel-token');
      localStorage.removeItem('ss-easel-user');
      localStorage.removeItem('ss-easel-accounts');
      localStorage.removeItem(AUTH_KEY);

  var PM = { open: false, playing: false, raf: 0, tick: 0, speed: 3, size: 102, mirror: false };
  var PM_LH = 1.75;
  function pmApplySize() {
    var el = document.getElementById('pmText');
    el.style.fontSize = PM.size + 'px';
    var stage = document.querySelector('.pm-stage');
    var h = stage ? stage.clientHeight : 0;
    if (h) el.style.paddingTop = Math.max(20, Math.round(h * 0.4 - PM.size * PM_LH / 2)) + 'px';
  }
  function pmProgress() {
    var b = document.getElementById('pmBody');
    var max = Math.max(0, b.scrollHeight - b.clientHeight);
    var pct = max > 0 ? Math.min(100, Math.round(b.scrollTop / max * 100)) : 100;
    document.getElementById('pmProgress').textContent = pct + '%';
  }
  function pmPause() {
    PM.playing = false;
    clearInterval(PM.tick);
    if (PM.raf) { cancelAnimationFrame(PM.raf); PM.raf = 0; }
    document.getElementById('pmCount').classList.remove('show');
    document.getElementById('pmPlay').innerHTML = icon('play') + '播放';
  }
  function pmRun() {
    PM.playing = true;
    document.getElementById('pmPlay').innerHTML = icon('pause') + '暂停';
    var b = document.getElementById('pmBody');
    var step = function () {
      if (!PM.playing) return;
      var max = Math.max(0, b.scrollHeight - b.clientHeight);
      b.scrollTop = Math.min(max, b.scrollTop + PM.speed * 0.55);
      pmProgress();
      if (b.scrollTop >= max - 0.5) { pmPause(); toast('已到结尾'); return; }
      PM.raf = requestAnimationFrame(step);
    };
    PM.raf = requestAnimationFrame(step);
  }
  function pmCountdown() {
    var el = document.getElementById('pmCount'), n = 3;
    el.textContent = '3'; el.classList.add('show');
    PM.tick = setInterval(function () {
      n--;
      if (n <= 0) { clearInterval(PM.tick); el.classList.remove('show'); pmRun(); }
      else el.textContent = String(n);
    }, 700);
  }
  function pmPlay() {
    if (PM.playing) return;
    var b = document.getElementById('pmBody');
    var max = Math.max(0, b.scrollHeight - b.clientHeight);
    if (b.scrollTop >= max - 1) b.scrollTop = 0;
    if (b.scrollTop < 4) { pmCountdown(); return; }
    pmRun();
  }
  function pmToggle() { if (PM.playing) pmPause(); else pmPlay(); }
  function pmSpeed(v) {
    PM.speed = Math.min(10, Math.max(1, v));
    document.getElementById('pmSpeed').value = PM.speed;
    document.getElementById('pmSpeedVal').textContent = PM.speed;
  }
  function pmSize(d) {
    PM.size = Math.min(168, Math.max(30, PM.size + d));
    pmApplySize();
    document.getElementById('pmSizeVal').textContent = PM.size;
  }
  function closeTele() { PM.open = false; pmPause(); document.getElementById('prompter').classList.remove('show'); }
  function bindPrompter() {
    document.getElementById('pmPlay').addEventListener('click', pmToggle);
    document.getElementById('pmClose').addEventListener('click', closeTele);
    document.getElementById('pmRestart').addEventListener('click', function () { pmPause(); document.getElementById('pmBody').scrollTop = 0; pmProgress(); });
    document.getElementById('pmFontUp').addEventListener('click', function () { pmSize(6); });
    document.getElementById('pmFontDown').addEventListener('click', function () { pmSize(-6); });
    document.getElementById('pmMirror').addEventListener('click', function () {
      PM.mirror = !PM.mirror;
      document.getElementById('prompter').classList.toggle('mirror', PM.mirror);
      this.classList.toggle('on', PM.mirror);
    });
    document.getElementById('pmSpeed').addEventListener('input', function () { pmSpeed(+this.value); });
    document.getElementById('pmBody').addEventListener('scroll', pmProgress);
    window.addEventListener('resize', function () { if (PM.open) pmApplySize(); });
    pmSpeed(PM.speed); pmApplySize();
    document.getElementById('pmSizeVal').textContent = PM.size;
  }

  function ciSplitCsv(line, delim) {
    var out = []; var cur = ''; var q = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === delim && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); });
  }
  function ciCommentsFromFile(name, text) {
    var lower = String(name || '').toLowerCase();
    if (lower.slice(-5) === '.json') {
      try {
        var j = JSON.parse(text);
        var arr = Array.isArray(j) ? j : (j.comments || j.elected_comment || j.data || []);
        return (arr || []).map(function (c) {
          var a = c.author || c.nick_name || c.nickname || c.user || '匿名';
          var t = c.text || c.content || c.comment || c.message || '';
          var reg = c.region || c.ip_label || c.ip_location || c.location || '';
          return t ? (a + '：' + t + (reg ? '【' + reg + '】' : '')) : '';
        }).filter(Boolean);
      } catch (e) { return []; }
    }
    if (lower.slice(-4) === '.csv' || lower.slice(-4) === '.tsv') {
      var rows = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
      if (!rows.length) return [];
      var delim = rows[0].indexOf('\t') >= 0 ? '\t' : ',';
      var head = ciSplitCsv(rows[0], delim).map(function (s) { return s.toLowerCase(); });
      var idx = function (names) {
        for (var i = 0; i < head.length; i++) for (var k = 0; k < names.length; k++) if (head[i].indexOf(names[k]) >= 0) return i;
        return -1;
      };
      var ai = idx(['昵称', '作者', 'author', 'nick', 'name']);
      var ti = idx(['内容', '评论', '留言', 'text', 'content', 'comment']);
      var ri = idx(['地区', '地域', '省份', '属地', 'ip', 'region']);
      var start = (ai >= 0 || ti >= 0) ? 1 : 0;
      var out = [];
      for (var r = start; r < rows.length; r++) {
        var cols = ciSplitCsv(rows[r], delim);
        var a = ai >= 0 ? (cols[ai] || '匿名') : (cols.length > 1 ? (cols[0] || '匿名') : '匿名');
        var t = ti >= 0 ? (cols[ti] || '') : (cols.length > 1 ? cols.slice(1).join(delim) : (cols[0] || ''));
        var reg = ri >= 0 ? (cols[ri] || '') : '';
        if (t) out.push(a + '：' + t + (reg ? '【' + reg + '】' : ''));
      }
      return out;
    }
    return String(text || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);

    };

      u.addEventListener('input', function () { CI.url = u.value; });
      u.addEventListener('keydown', function (e) { if (e.key === 'Enter') ciRun(); });
    }
    var run = $('#ciRun'); if (run) run.addEventListener('click', ciRun);
    var nw = $('#ciNew'); if (nw) nw.addEventListener('click', function () { CI.report = null; CI.error = ''; CI.loading = false; CI.tab = 'analyze'; render(); });
    var wt = $('#ciWxText'); if (wt) wt.addEventListener('input', function () { CI.wxText = wt.value; });
    var fi = $('#ciWxFile'); if (fi) fi.addEventListener('change', function () { if (fi.files && fi.files[0]) ciImportComments(fi.files[0]); fi.value = ''; });
    var hr = $('#ciHistRefresh'); if (hr) hr.addEventListener('click', function () { CI.reports = null; ciLoadReports(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ci-open]'), function (b) { b.addEventListener('click', function () { ciOpen(b.dataset.ciOpen); }); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ci-del]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.dataset.ciDel;
        if (!confirm('删除这条报告？')) return;
        fetch(ciApiBase() + '/api/intel/reports/' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.ok) {
              if (CI.report && CI.report.id === id) CI.report = null;
              CI.reports = null;
              ciLoadReports();
              toast('已删除报告');
            } else {
              toast('删除失败');
            }
          })
          .catch(function (e2) { toast('删除失败：' + ((e2 && e2.message) || e2)); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ci-export]'), function (b) {
      b.addEventListener('click', function () {
        if (!CI.report) return;
        window.open(ciApiBase() + '/api/intel/reports/' + encodeURIComponent(CI.report.id) + '/export?format=' + b.dataset.ciExport, '_blank');
      });
    });
    if (CI.tab === 'reports' && !CI.report && !CI.reports) ciLoadReports();
    ciMountCharts();
  }

  function render() {
    renderRail();
    var stage = document.getElementById('stage');
    var c = state.center;
    var pane = !!PANE[c];
    var wide = c === 'intercept' || c === 'intel';
    if (wide) pane = false;
    stage.className = 'stage' + (pane ? ' pane' : '') + (c === 'studio' || c === 'video' ? ' studio' : '');
    stage.innerHTML = c === 'intercept' ? viewIntercept()
      : c === 'intel' ? viewIntel()
      : c === 'studio' ? viewStudio()
      : c === 'video' ? viewVideo()
      : viewIntercept();
    stage.scrollTop = 0;
    bindStage();
    renderChrome();
    persist();
  }

  document.addEventListener('keydown', function (e) {
    if (PM.open) {
      if (e.key === 'Escape') { e.preventDefault(); closeTele(); }
      else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); pmToggle(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); pmSpeed(PM.speed + 1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); pmSpeed(PM.speed - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); pmSize(6); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); pmSize(-6); }
      return;
    }
    if (!e.ctrlKey) { if (e.key === 'Escape') closeSheet(); return; }
    var idx = parseInt(e.key, 10);
    if (idx >= 1 && idx <= CENTERS.length) { e.preventDefault(); state.center = CENTERS[idx - 1].k; render(); }
    if (e.key === 'Escape') closeSheet();
  });

  setInterval(function () {
    if (state.recDev !== 'recording') return;
    REC_SEC++;
    var el = document.getElementById('recElapsed');
    if (el) el.textContent = hm(REC_SEC);
  }, 1000);

  bindPrompter();
  Array.prototype.forEach.call(document.querySelectorAll('[data-win]'), function (button) {
    button.addEventListener('click', function () {
      if (window.desktopWindow) window.desktopWindow.control(button.dataset.win);
    });
  });

  /* ---------------- 用户登录 / 退出 ---------------- */
  var AUTH_KEY = 'ss-auth-user';
  function authUser() { try { return localStorage.getItem(AUTH_KEY) || ''; } catch (e) { return ''; } }
  function authGate(which) {
    var g = document.getElementById('authGate');
    if (!g) return;
    g.classList.add('show');
    var lg = document.getElementById('authLogin'), lo = document.getElementById('authLogout');
    if (lg) lg.style.display = which === 'login' ? '' : 'none';
    if (lo) lo.style.display = which === 'logout' ? '' : 'none';
    if (which === 'login') { var u = document.getElementById('authUser'); if (u) setTimeout(function () { u.focus(); }, 30); }
  }
  function authHide() { var g = document.getElementById('authGate'); if (g) g.classList.remove('show'); }
  function authSubmit(mode) {
    var name = (document.getElementById('authUser').value || '').trim();
    var pass = document.getElementById('authPass').value || '';
    var err = document.getElementById('authErr');
    if (!name) { if (err) err.textContent = '请输入账号'; return; }
    if (!pass) { if (err) err.textContent = '请输入密码'; return; }
    if (err) err.textContent = '';
    var btn = document.getElementById('authLoginBtn');
    if (btn) { btn.disabled = true; btn.textContent = mode === 'register' ? '注册中…' : '登录中…'; }
    var url = window.SS_SERVICES.easel + '/api/auth/' + (mode === 'register' ? 'register' : 'login');
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: name, password: pass }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.detail) || ('HTTP ' + r.status)); return j; }); })
      .then(function (j) {
        try {
          localStorage.setItem('ss-easel-token', j.token || '');
          localStorage.setItem('ss-easel-user', JSON.stringify(j.user || {}));
          localStorage.setItem(AUTH_KEY, name);
        } catch (e) {}
        state.userName = (j.user && (j.user.displayName || j.user.username)) || name;
        authHide();
        easelReloadIframe();
        render();
        toast((mode === 'register' ? '账号已创建，欢迎 ' : '欢迎回来，') + state.userName);
      })
      .catch(function (e) { if (err) err.textContent = (mode === 'register' ? '注册失败：' : '登录失败：') + (e.message || e); })
      .finally(function () { if (btn) { btn.disabled = false; btn.textContent = '登 录'; } });
  }
  function doLogin() { authSubmit('login'); }
  function doRegister() { authSubmit('register'); }
  (function bindAuth() {
    var b = document.getElementById('authLoginBtn'); if (b) b.addEventListener('click', doLogin);
    var reg = document.getElementById('authRegBtn'); if (reg) reg.addEventListener('click', function (e) { e.preventDefault(); doRegister(); });
    var back = document.getElementById('authBackBtn'); if (back) back.addEventListener('click', function () { authGate('login'); });
    var pass = document.getElementById('authPass'); if (pass) pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
    var user = document.getElementById('authUser'); if (user) user.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var pp = document.getElementById('authPass'); if (pp) pp.focus(); } });
  })();
  (function initAuth() {
    var t = ''; try { t = localStorage.getItem('ss-easel-token') || ''; } catch (e) {}
    if (!t) { authGate('login'); render(); return; }
    fetch(window.SS_SERVICES.easel + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + t } })
      .then(function (r) { if (!r.ok) throw new Error('unauthorized'); return r.json(); })
      .then(function (u) {
        state.userName = u.displayName || u.username || state.userName;
        try { localStorage.setItem('ss-easel-user', JSON.stringify(u)); } catch (e) {}
        authHide(); render();
      })
      .catch(function () {
        try { localStorage.removeItem('ss-easel-token'); localStorage.removeItem('ss-easel-user'); } catch (e) {}
        authGate('login'); render();
      });
  })();
  render();
})();
</script>

<script>
(function () {
  var host = document.getElementById('modeSwitch');
  if (!host) return;
  var mode = localStorage.getItem('ss-mode') || 'agent';
  var SW = '<button data-m="agent">智能体模式</button><button data-m="tool">工具模式</button>';

  var ov = document.createElement('div');
  ov.id = 'agentOverlay';
  var _tk = ''; try { _tk = localStorage.getItem('ss-easel-token') || ''; } catch (e) {}
  var _src = window.SS_SERVICES.easel + '/?v=9' + (_tk ? '&token=' + encodeURIComponent(_tk) : '');
  ov.innerHTML = '<iframe src="' + _src + '" allow="clipboard-write; microphone; camera"></iframe>';
  document.body.appendChild(ov);

  // 智能体 iframe 内登录后，把 token/用户同步到工具模式左栏账号按钮
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'easel-auth' || !d.token || !d.user) return;
    try {
      localStorage.setItem('ss-easel-token', d.token);
      localStorage.setItem('ss-easel-user', JSON.stringify(d.user));
      var list = [];
      try { list = JSON.parse(localStorage.getItem('ss-easel-accounts') || '[]'); } catch (x) {}
      list = list.filter(function (x) { return !x.user || x.user.id !== d.user.id; });
      list.unshift({ user: d.user, token: d.token });
      localStorage.setItem('ss-easel-accounts', JSON.stringify(list.slice(0, 20)));
    } catch (x) {}
    var btn = document.getElementById('railAcct');
    if (btn) {
      var av = btn.querySelector('.avatar'); if (av) av.textContent = (d.user.displayName || d.user.username || '?').slice(0, 1);
      var tp = btn.querySelector('.tip'); if (tp) tp.textContent = d.user.displayName || d.user.username;
    }
  });
  host.innerHTML = SW;

  function apply() {
    Array.prototype.forEach.call(document.querySelectorAll('.modesw button'), function (b) {
      b.classList.toggle('on', b.dataset.m === mode);
    });
    document.body.classList.toggle('agent-mode', mode === 'agent');
  }
  function onClick(e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b || !b.dataset.m) return;
    mode = b.dataset.m;
    try { localStorage.setItem('ss-mode', mode); } catch (x) {}
    apply();
  }
  document.addEventListener('click', onClick);
  apply();
})();
</script>
